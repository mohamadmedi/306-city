<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>306 City | Support</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">306 <span>CITY</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="join.html">How to Join</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>
        <section class="news-hero">
            <p class="subtitle">WE ARE HERE TO HELP</p>
            <h1>Player <span>Support</span></h1>
            <p>Having trouble? Send our team a support request.</p>
        </section>

        <section class="support-content">
            <form id="support-form">

                <label for="player-name">Minecraft Username</label>
                <input type="text" id="player-name" name="playerName" placeholder="Enter your username" required>

                <label for="player-email">Email Address</label>
                <input type="email" id="player-email" name="playerEmail" placeholder="Enter your email" required>

                <label for="support-topic">What do you need help with?</label>
                <select id="support-topic" name="topic" required>
                    <option value="">Choose a topic</option>
                    <option value="connection">Connection Problem</option>
                    <option value="account">Account Problem</option>
                    <option value="report">Report a Player</option>

                    <option value="other">Other</option>
                </select>

                <label for="support-message">Describe Your Problem</label>
                <textarea id="support-message" name="message" rows="6" placeholder="Tell us what happened..."
                    required></textarea>

                <button type="submit" class="button">
                    Send Support Request
                </button>

                <p id="form-message" role="status"></p>

            </form>
            <div class="telegram-support">
                <h2>Need Faster Help?</h2>
                <p>Contact our support team on Telegram.</p>

                <a class="telegram-button" href="https://t.me/306TELEGRAM_ID" target="_blank"
                    rel="noopener noreferrer">
                    ✈ Contact Us on Telegram
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>© 306 City - Minecraft City Server</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
