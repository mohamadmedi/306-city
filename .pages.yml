content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: image
        label: Image
        type: string

      - name: body
        label: Content
        type: rich-text
        required: true