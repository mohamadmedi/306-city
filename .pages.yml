media:
  - name: images
    label: Images
    input: images
    output: images
    categories: [image]

content:
  - name: news
    label: News
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        required: true

      - name: image
        label: Image
        type: image
        options:
          media: images

      - name: body
        label: Content
        type: rich-text
        required: true