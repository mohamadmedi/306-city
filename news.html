<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>306 City | News</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">306 <span>CITY</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="news.html">News</a>
            <a href="join.html">How to Join</a>
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>
        <section class="news-hero">
            <p class="subtitle">WHAT'S HAPPENING?</p>
            <h1>Latest <span>News</span></h1>
            <p>Updates, events, and announcements from 306 City.</p>
        </section>

            <section class="news-list" id="news-list">
    <p>Loading news...</p>
</section>
    </main>

    <footer>
        <p>© 306 City - Minecraft City Server</p>
    </footer>
<script>
async function loadNews() {
    const newsList = document.getElementById("news-list");

    try {
        const response = await fetch("data/news.json");
        if (!response.ok) throw new Error("News could not be loaded");

        const news = await response.json();

        newsList.innerHTML = "";

        if (news.length === 0) {
            newsList.innerHTML = "<p>No news available yet.</p>";
            return;
        }

        news.forEach(item => {
            const card = document.createElement("article");
            card.className = "news-card";
if (item.image) {
    const img = document.createElement("img");
    img.src = item.image;
    img.alt = item.title || "News image";
    img.className = "news-image";
    card.appendChild(img);
}
            const title = document.createElement("h2");
            title.textContent = item.title || "";

            const date = document.createElement("span");
            date.className = "news-date";
            date.textContent = item.date || "";

            const content = document.createElement("p");
            content.textContent = item.body || "";

            card.append(title, content, date);
            newsList.appendChild(card);
        });

    } catch (error) {
        newsList.innerHTML = "<p>Could not load news. Please try again later.</p>";
        console.error(error);
    }
}

loadNews();
</script>
</body>

</html>
